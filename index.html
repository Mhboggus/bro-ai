<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bro.ai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ridiculous AI gradient background */
    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(255, 0, 200, .8),
          rgba(70, 90, 255, .55),
          rgba(0, 255, 200, .25),
          transparent 70%);
      filter: blur(80px);
      animation: broOrb 5s ease-in-out infinite alternate;
    }

    @keyframes broOrb {
      from {
        transform: translate(-25%, -20%) scale(.8) rotate(0deg);
      }

      to {
        transform: translate(25%, 20%) scale(1.4) rotate(180deg);
      }
    }

    .container {
      position: relative;
      text-align: center;
      z-index: 2;
      animation: enterBro 1.3s cubic-bezier(.17,.67,.3,1.3);
    }

    @keyframes enterBro {
      0% {
        opacity: 0;
        transform: scale(.3) rotate(-8deg);
        filter: blur(20px);
      }

      70% {
        transform: scale(1.12) rotate(2deg);
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      top: 28px;
      left: 32px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -1px;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: clamp(70px, 16vw, 170px);
      letter-spacing: -8px;
      line-height: .9;
      animation: breathe 2.4s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from {
        transform: scale(1);
        text-shadow: 0 0 0px rgba(255,255,255,0);
      }

      to {
        transform: scale(1.04);
        text-shadow:
          0 0 25px rgba(255,255,255,.25),
          0 0 70px rgba(110,80,255,.35);
      }
    }

    .status {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .5;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: #4cff8f;
      box-shadow: 0 0 12px #4cff8f;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: .25; }
      to { opacity: 1; }
    }

    .bro {
      position: absolute;
      font-size: 12px;
      opacity: 0;
      animation: floatBro 4s linear infinite;
      pointer-events: none;
    }

    @keyframes floatBro {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(.6);
      }

      20% {
        opacity: .4;
      }

      80% {
        opacity: .15;
      }

      100% {
        opacity: 0;
        transform: translateY(-250px) scale(1.3);
      }
    }
  </style>
</head>

<body>

  <div class="logo">bro.ai</div>

  <main class="container">
    <h1>sup bro</h1>

    <div class="status">
      <span class="dot"></span>
      AGI achieved
    </div>
  </main>

  <script>
    // Because apparently bro.ai needs particle effects.
    function spawnBro() {
      const bro = document.createElement("div");

      bro.className = "bro";
      bro.innerText = "bro";

      bro.style.left = Math.random() * 100 + "vw";
      bro.style.top = (70 + Math.random() * 30) + "vh";
      bro.style.animationDuration =
        (3 + Math.random() * 3) + "s";

      document.body.appendChild(bro);

      setTimeout(() => {
        bro.remove();
      }, 6000);
    }

    setInterval(spawnBro, 350);
  </script>

</body>
</html>
